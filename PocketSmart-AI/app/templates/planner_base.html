{% extends "base.html" %}

{% block content %}

<div class="auth wide">

    <small>
        {{ eyebrow }}
    </small>

    <h1>
        {{ heading }}
    </h1>

    <p>
        {{ description }}
    </p>

    {% if error %}
        <p class="error">
            {{ error }}
        </p>
    {% endif %}

    <form
        method="post"
        action="{{ action }}"
        enctype="{{ enctype|default('application/x-www-form-urlencoded') }}"
    >

        {% block form %}
        {% endblock %}

        <button class="btn full">
            Generate AI Recommendations
        </button>

    </form>

</div>

{% endblock %}

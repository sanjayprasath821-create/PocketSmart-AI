{% extends "base.html" %}

{% block title %}
Register
{% endblock %}

{% block content %}

<div class="auth">

    <small>
        CREATE ACCOUNT
    </small>

    <h1>
        Get started
    </h1>

    {% if error %}
        <p class="error">
            {{ error }}
        </p>
    {% endif %}

    <form
        method="post"
        action="/register-form"
    >

        <label>
            Name

            <input
                name="name"
                required
            >
        </label>

        <label>
            Email

            <input
                type="email"
                name="email"
                required
            >
        </label>

        <label>
            Password

            <input
                type="password"
                name="password"
                minlength="6"
                required
            >
        </label>

        <button class="btn">
            Create account
        </button>

    </form>

    <p>
        Already registered?
        <a href="/login">
            Sign in
        </a>
    </p>

</div>

{% endblock %}

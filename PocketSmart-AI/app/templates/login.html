{% extends "base.html" %}

{% block title %}
Login
{% endblock %}

{% block content %}

<div class="auth">

    <small>
        WELCOME BACK
    </small>

    <h1>
        Sign in
    </h1>

    {% if request.query_params.get("error") %}
        <p class="error">
            {{ request.query_params.get("error") }}
        </p>
    {% endif %}

    <form
        method="post"
        action="/login-form"
    >

        <label>
            Email

            <input
                type="email"
                name="email"
                required
            >
        </label>

        <label>
            Password

            <input
                type="password"
                name="password"
                required
            >
        </label>

        <button class="btn">
            Sign in
        </button>

    </form>

    <p>
        New here?
        <a href="/register">
            Create account
        </a>
    </p>

</div>

{% endblock %}

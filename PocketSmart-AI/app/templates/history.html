{% extends "base.html" %}

{% block title %}
History
{% endblock %}


{% block content %}

<h1>
    Recommendation history
</h1>


{% for item in history %}

<p class="row">

    <a
        href="/recommendations-details/{{ item.id }}"
    >
        <b>
            {{ item.planner|title }}
        </b>
    </a>

    —
    {{ item.created_at.strftime("%d %b %Y %H:%M") }}

</p>

{% else %}

<p>
    No history yet.
</p>

{% endfor %}

{% endblock %}

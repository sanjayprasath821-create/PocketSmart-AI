<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width,initial-scale=1"
    >

    <title>
        {% block title %}
        PocketSmart AI
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/style.css') }}"
    >
</head>

<body>

<nav>
    <a class="brand" href="/">
        PocketSmart AI
    </a>

    <div>
        {% if user %}
            <a href="/dashboard">Dashboard</a>
            <a href="/history">History</a>
            <a href="/logout">Logout</a>
        {% else %}
            <a href="/login">Login</a>
            <a href="/register">Register</a>
        {% endif %}
    </div>
</nav>

<main>
    {% block content %}
    {% endblock %}
</main>

<footer>
    PocketSmart AI • Verify live prices and availability before purchase.
</footer>

</body>
</html>
